<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<header>
    <h1>Formulário de Cadastro</h1>
</header>

<body>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="name">Nome Completo:</label>
            <input type="text" id="name" name="name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <label for="phone">Telefone:</label>
            <input type="tel" id="phone" name="phone" placeholder="(XX) XXXX-XXXX">
            <label for="birthdate">Data de Nascimento:</label>
            <input type="date" id="birthdate" name="birthdate" min="1950-01-01" max="2010-12-31">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
        </fieldset>
        <fieldset>
            <legend>Profissional</legend>
            <label for="profession">Cargo Desejado:</label>
            <input type="text" id="profession" name="profession">
            <label>Nível de Senioridade:</label>
            <input type="radio" id="junior" name="level" value="junior">
            <label for="junior">Júnior</label>
            <input type="radio" id="pleno" name="level" value="pleno">
            <label for="pleno">Pleno</label>
            <input type="radio" id="senior" name="level" value="senior">
            <label for="senior">Sênior</label>
            <label for="experience">Anos de Experiência:</label>
            <input type="number" id="experience" name="experience" min="0" max="100">
            <label for="pretension">Pretensão Salarial:</label>
            <input type="number" id="pretension" name="pretension" min="0" max="100000">
            <label for="linkedin">Link do LinkedIn:</label>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/seu-usuario/"
                required>
        </fieldset>
        <fieldset>
            <legend>Complementar</legend>
            <label for="language">Linguagem favorita:</label>
            <input type="text" id="language" name="language" placeholder="Linguagem favorita" required>
            <label for="about">Sobre mim:</label>
            <textarea id="about" name="about" placeholder="Sobre mim" required max="500"></textarea>
            <label for="cv">Upload de currículo:</label>
            <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">
            <label>Aceito os termos:</label>
            <input type="checkbox" id="terms" name="terms" required>
            <input type="submit" value="Enviar">
        </fieldset>

    </form>
</body>

<footer>
    <p>&copy; 2026 Exercicio de HTML Avançado. Todos os direitos reservados.</p>

</footer>

</html>
